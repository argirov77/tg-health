services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    command: >
      python -m app.rq_worker
    restart: unless-stopped

  scheduler:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    command: >
      python -m app.scheduler
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coachbot}
      POSTGRES_USER: ${POSTGRES_USER:-coachbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coachbot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
